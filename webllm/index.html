<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>WebLLM Quick Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { white-space: pre-wrap; background: #f4f4f4; padding: 1rem; border-radius: 8px; min-height: 12rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
    select, input { font-size: 1rem; padding: 0.4rem; }
    .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
    .row input { flex: 1; }
  </style>
</head>
<body>
  <h1>WebLLM Quick Demo</h1>
  <p>WebGPU 지원 브라우저(Chrome/Edge 최신, Safari TP)에서 열어 주세요. 모델은 처음 한 번만 다운로드되고 IndexedDB에 캐시됩니다.</p>

  <div class="row">
    <label>모델
      <select id="model">
        <option value="Llama-3.2-1B-Instruct-q4f32_1-MLC">Llama-3.2-1B-Instruct (가장 가벼움)</option>
        <option value="Llama-3.2-3B-Instruct-q4f32_1-MLC">Llama-3.2-3B-Instruct</option>
        <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi-3.5-mini-instruct</option>
        <option value="Qwen2.5-1.5B-Instruct-q4f32_1-MLC">Qwen2.5-1.5B-Instruct</option>
      </select>
    </label>
    <button id="load">모델 로드</button>
  </div>

  <div class="row">
    <input id="prompt" placeholder="질문을 입력하고 Enter" value="한 문장으로 자기소개해줘." />
    <button id="ask" disabled>전송</button>
  </div>

  <div id="log"></div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const log = (msg) => { document.getElementById("log").textContent += msg; };
    const reset = () => { document.getElementById("log").textContent = ""; };

    let engine = null;

    document.getElementById("load").onclick = async () => {
      reset();
      const model = document.getElementById("model").value;
      log(`Loading ${model} ...\n`);
      engine = await webllm.CreateMLCEngine(model, {
        initProgressCallback: (p) => log(`  ${p.text}\n`),
      });
      log("\n모델 준비 완료. 질문을 입력하세요.\n\n");
      document.getElementById("ask").disabled = false;
    };

    document.getElementById("ask").onclick = async () => {
      if (!engine) return;
      const prompt = document.getElementById("prompt").value;
      log(`\n> ${prompt}\n`);
      const stream = await engine.chat.completions.create({
        messages: [{ role: "user", content: prompt }],
        stream: true,
      });
      for await (const chunk of stream) {
        log(chunk.choices[0]?.delta?.content || "");
      }
      log("\n");
    };

    document.getElementById("prompt").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("ask").click();
    });
  </script>
</body>
</html>
